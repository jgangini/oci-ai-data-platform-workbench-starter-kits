apiVersion: v1
kind: Namespace
metadata:
  name: aidp-governance
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-data-governance
  namespace: aidp-governance
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-data-governance-gateway
  namespace: aidp-governance
  labels:
    app.kubernetes.io/name: ai-data-governance-gateway
    app.kubernetes.io/version: "2.1.10"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-data-governance-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-data-governance-gateway
    spec:
      serviceAccountName: ai-data-governance
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ${jsonencode(gateway_image)}
          imagePullPolicy: IfNotPresent
          args:
            - uvicorn
            - governance_gateway.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          env:
            - name: GOVERNANCE_OCI_REGION
              value: ${jsonencode(oci_region)}
            - name: GOVERNANCE_OIDC_ISSUER
              value: ${jsonencode(oidc_issuer)}
            - name: GOVERNANCE_OIDC_AUTHORITY
              value: ${jsonencode(oidc_authority)}
            - name: GOVERNANCE_OIDC_AUDIENCE
              value: ${jsonencode(oidc_audience)}
            - name: GOVERNANCE_AIDP_PLATFORM_ID
              value: ${jsonencode(aidp_platform_id)}
            - name: GOVERNANCE_JDBC_SECRET_OCID
              value: ${jsonencode(jdbc_secret_ocid)}
            - name: GOVERNANCE_JDBC_USER_OCID
              value: ${jsonencode(jdbc_user_ocid)}
            - name: GOVERNANCE_JDBC_DRIVER_OBJECT
              value: ${jsonencode(jdbc_driver_object)}
            - name: GOVERNANCE_JDBC_DRIVER_BUCKET
              value: ${jsonencode(jdbc_driver_bucket)}
            - name: GOVERNANCE_OBJECT_STORAGE_NAMESPACE
              value: ${jsonencode(object_storage_namespace)}
            - name: GOVERNANCE_CONTROL_LOCATION
              value: ${jsonencode(control_delta_location)}
            - name: GOVERNANCE_TOKENIZATION_KEY_OCID
              value: ${jsonencode(tokenization_key_ocid)}
            - name: GOVERNANCE_TOKENIZATION_CRYPTO_ENDPOINT
              value: ${jsonencode(tokenization_crypto_endpoint)}
            - name: GOVERNANCE_CONTROL_CATALOG
              value: aidp_lab
            - name: GOVERNANCE_CONTROL_SCHEMA
              value: oci_control
            - name: GOVERNANCE_MAX_RESULT_ROWS
              value: "1000"
            - name: GOVERNANCE_MAX_RESULT_BYTES
              value: "5242880"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: runtime
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-data-governance-gateway
  namespace: aidp-governance
  annotations:
    oci.oraclecloud.com/load-balancer-type: "lb"
    service.beta.kubernetes.io/oci-load-balancer-internal: "true"
    oci.oraclecloud.com/reserved-private-ips: ${jsonencode(gateway_backend_ip)}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ai-data-governance-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-data-governance-gateway
  namespace: aidp-governance
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-data-governance-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-data-governance-default-deny
  namespace: aidp-governance
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - ipBlock:
            cidr: ${jsonencode(gateway_subnet_cidr)}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
