name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform_version: ["1.5.7", "1.15.7"]
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform_version }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - if: matrix.terraform_version == '1.15.7'
        run: terraform test
      - if: matrix.terraform_version == '1.15.7'
        run: python tests/check_module_plan.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt
      - run: pip install -r apps/backend/requirements-dev.txt
      - run: python -m pytest apps/backend/tests terraform/tests
        env:
          SESSION_SECRET_FILE: ${{ runner.temp }}/aidp-lab/session.key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t aidp-lab:test .
      - run: docker build -f apps/gods-eye-view/Dockerfile -t gods-eye-view:test .

  social-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install pyspark==3.5.1 delta-spark==3.2.0 langgraph==0.6.7 pydantic==2.13.4 oci==2.189.0
      - run: python scripts/check_social_graph.py
      - run: python scripts/export_sonda_contract.py --check
      - run: python scripts/render_sonda_runtime.py --check
      - run: python scripts/check_sonda_study_graph.py
      - run: python scripts/check_sonda_delta.py --prepare .tmp/sonda-delta-input.json
      - run: spark-submit --packages io.delta:delta-spark_2.12:3.2.0 scripts/check_sonda_delta.py --input .tmp/sonda-delta-input.json
      - run: spark-submit --packages io.delta:delta-spark_2.12:3.2.0 scripts/check_social_delta.py
      - run: spark-submit --packages io.delta:delta-spark_2.12:3.2.0 scripts/check_social_comments.py
