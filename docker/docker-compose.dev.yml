name: aidp-lab-dev

services:
  aidp-lab:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env.dev
    environment:
      PRISMA_VIEWER_URL: http://prisma-viewer:8081
      PRISMA_VIEWER_ENABLED: "true"
    ports:
      - "127.0.0.1:18081:80"
      - "127.0.0.1:18444:443"
    volumes:
      - aidp-session-dev:/var/lib/aidp-lab
    restart: unless-stopped

  prisma-viewer:
    build:
      context: ..
      dockerfile: apps/prisma-viewer/Dockerfile
    environment:
      PRISMA_MODE: local
      PRISMA_ADMIN_URL: http://aidp-lab:8000
    expose:
      - "8081"
    restart: unless-stopped

volumes:
  aidp-session-dev:
