name: aidp-lab-dev

services:
  aidp-lab:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_RELEASE_SHA: ${APP_RELEASE_SHA:-development}
    env_file: ../.env.dev
    environment:
      GODS_EYE_VIEW_URL: http://gods-eye-view:8081
      GODS_EYE_VIEW_ENABLED: "true"
      COOKIE_SECURE: "false"
      LOCAL_IDENTITY_ARTIFACT_DIR: /var/lib/aidp-lab/local-artifacts
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - aidp-session-dev:/var/lib/aidp-lab
      - ./nginx.oci-local.conf:/etc/nginx/nginx.conf:ro
      - local-identity-artifacts-dev:/var/lib/aidp-lab/local-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/api/health"]
    restart: unless-stopped

  gods-eye-view:
    build:
      context: ..
      dockerfile: modules/ai-gods-eye-view/Dockerfile
    environment:
      GODS_EYE_VIEW_MODE: local
      GODS_EYE_VIEW_ADMIN_URL: http://aidp-lab:8000
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - prisma-native-cache-dev:/app/.upstream/.gev-cache
    restart: unless-stopped

volumes:
  local-identity-artifacts-dev:
  aidp-session-dev:
  prisma-native-cache-dev:
