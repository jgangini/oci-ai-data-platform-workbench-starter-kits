name: aidp-lab-dev

services:
  aidp-lab:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env.dev
    environment:
      PRISMA_VIEWER_URL: http://prisma-viewer:8081
      PRISMA_VIEWER_ENABLED: "true"
      COOKIE_SECURE: "false"
      LOCAL_IDENTITY_ARTIFACT_DIR: /var/lib/aidp-lab/local-artifacts
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - aidp-session-dev:/var/lib/aidp-lab
      - ./nginx.oci-local.conf:/etc/nginx/nginx.conf:ro
      - ../../../.local/prisma:/var/lib/aidp-lab/local-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/api/health"]
    restart: unless-stopped

  prisma-viewer:
    build:
      context: ..
      dockerfile: apps/prisma-viewer/Dockerfile
    environment:
      PRISMA_MODE: local
      PRISMA_ADMIN_URL: http://aidp-lab:8000
    expose:
      - "8081"
    restart: unless-stopped

volumes:
  aidp-session-dev:
