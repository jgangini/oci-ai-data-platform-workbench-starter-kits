user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 80 default_server;
    location ^~ /.well-known/acme-challenge/ {
      root /var/lib/letsencrypt;
      default_type text/plain;
      try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
  }

  server {
    listen 443 ssl default_server;
    ssl_certificate /etc/aidp-lab/tls/tls.crt;
    ssl_certificate_key /etc/aidp-lab/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /_prisma_session {
      internal;
      proxy_pass http://127.0.0.1:8000/api/prisma/session;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin/prisma { return 308 /admin/gods-eye-view$is_args$args; }
    location = /local/prisma/login { return 308 /local/gods-eye-view/login$is_args$args; }
    location = /local/prisma/workspace { return 308 /local/gods-eye-view/workspace$is_args$args; }
    location = /prisma { return 308 /gods-eye-view/$is_args$args; }
    location /prisma/ { rewrite ^/prisma/(.*)$ /gods-eye-view/$1 permanent; }
    location = /gods-eye-view { return 308 /gods-eye-view/$is_args$args; }
    location /gods-eye-view/ {
      auth_request /_prisma_session;
      auth_request_set $prisma_user $upstream_http_x_prisma_user;
      proxy_set_header X-PRISMA-User $prisma_user;
      proxy_set_header Host $host;
      proxy_pass http://127.0.0.1:8081/;
    }

    location /api/prisma/ {
      auth_request /_prisma_session;
      auth_request_set $prisma_user $upstream_http_x_prisma_user;
      proxy_set_header X-PRISMA-User $prisma_user;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
      client_max_body_size 1m;
      proxy_pass http://127.0.0.1:8081;
    }

    location /api/ {
      client_max_body_size 1m;
      proxy_pass http://127.0.0.1:8000;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
