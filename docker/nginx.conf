user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 80 default_server;
    location ^~ /.well-known/acme-challenge/ {
      root /var/lib/letsencrypt;
      default_type text/plain;
      try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
  }

  server {
    listen 443 ssl default_server;
    ssl_certificate /etc/aidp-lab/tls/tls.crt;
    ssl_certificate_key /etc/aidp-lab/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /_gods_eye_view_session {
      internal;
      proxy_pass http://127.0.0.1:8000/api/gods-eye-view/session;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(?:api/(?:admin/)?(?:prisma|territorial)(?:/|$)|(?:admin/|local/)?(?:prisma|territorial)(?:/|$)) { return 404; }
    location = /gods-eye-view { return 308 /gods-eye-view/$is_args$args; }
    location = /gods-eye-view/ {
      auth_request /_gods_eye_view_session;
      error_page 500 = @gods_eye_view_unavailable;
      auth_request_set $gods_eye_view_user $upstream_http_x_gods_eye_view_user;
      auth_request_set $gods_eye_view_role $upstream_http_x_gods_eye_view_role;
      error_page 401 = @gods_eye_view_login;
      proxy_set_header X-Gods-Eye-View-User $gods_eye_view_user;
      proxy_set_header X-Gods-Eye-View-Role $gods_eye_view_role;
      proxy_set_header X-GEV-Origin "$scheme://$http_host";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_pass http://127.0.0.1:8081/;
    }
    location @gods_eye_view_login {
      return 302 /viewer/login;
    }
    location @gods_eye_view_unavailable {
      default_type application/json;
      add_header Retry-After 2 always;
      return 503 '{"detail":"Viewer access could not be verified; try again shortly"}';
    }
    location @gods_eye_view_unauthorized {
      default_type application/json;
      return 401 '{"detail":"Viewer session required"}';
    }
    location /gods-eye-view/ {
      auth_request /_gods_eye_view_session;
      error_page 500 = @gods_eye_view_unavailable;
      error_page 401 = @gods_eye_view_unauthorized;
      auth_request_set $gods_eye_view_user $upstream_http_x_gods_eye_view_user;
      auth_request_set $gods_eye_view_role $upstream_http_x_gods_eye_view_role;
      proxy_set_header X-Gods-Eye-View-User $gods_eye_view_user;
      proxy_set_header X-Gods-Eye-View-Role $gods_eye_view_role;
      proxy_set_header X-GEV-Origin "$scheme://$http_host";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_pass http://127.0.0.1:8081/;
    }

    location ~ ^/api/gods-eye-view/oci-voice/turn$ {
      auth_request /_gods_eye_view_session;
      error_page 500 = @gods_eye_view_unavailable;
      error_page 401 = @gods_eye_view_unauthorized;
      auth_request_set $gods_eye_view_user $upstream_http_x_gods_eye_view_user;
      auth_request_set $gods_eye_view_role $upstream_http_x_gods_eye_view_role;
      proxy_set_header X-Gods-Eye-View-User $gods_eye_view_user;
      proxy_set_header X-Gods-Eye-View-Role $gods_eye_view_role;
      proxy_set_header X-GEV-Origin "$scheme://$http_host";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 300s;
      client_max_body_size 3m;
      proxy_pass http://127.0.0.1:8081;
    }

    location ~ ^/api/gods-eye-view/ {
      auth_request /_gods_eye_view_session;
      error_page 500 = @gods_eye_view_unavailable;
      error_page 401 = @gods_eye_view_unauthorized;
      auth_request_set $gods_eye_view_user $upstream_http_x_gods_eye_view_user;
      auth_request_set $gods_eye_view_role $upstream_http_x_gods_eye_view_role;
      proxy_set_header X-Gods-Eye-View-User $gods_eye_view_user;
      proxy_set_header X-Gods-Eye-View-Role $gods_eye_view_role;
      proxy_set_header X-GEV-Origin "$scheme://$http_host";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 300s;
      client_max_body_size 1m;
      proxy_pass http://127.0.0.1:8081;
    }

    # Native feeds retain the same authenticated session as the viewer.
    location ~ ^/(api/(opensky|opensky-track|adsblol|adsbdb|celestrak|tomtom|firms|launches|terrain|overpass|military-installations|regional-brief|geocode|weather-effects|cctv|radio|gbfs|local-receivers|transit|ais-live|openai|google|realtime|route|wind|weather|cyclones|fire-perimeters|setup/(?:status|browser))(/|$)|models/|(?:mic|logo|pin|location|visual-presets)\.svg$) {
      auth_request /_gods_eye_view_session;
      error_page 500 = @gods_eye_view_unavailable;
      error_page 401 = @gods_eye_view_unauthorized;
      auth_request_set $gods_eye_view_user $upstream_http_x_gods_eye_view_user;
      auth_request_set $gods_eye_view_role $upstream_http_x_gods_eye_view_role;
      proxy_set_header X-Gods-Eye-View-User $gods_eye_view_user;
      proxy_set_header X-Gods-Eye-View-Role $gods_eye_view_role;
      proxy_set_header X-GEV-Origin "$scheme://$http_host";
      proxy_set_header Host $http_host;
      proxy_read_timeout 300s;
      proxy_buffering off;
      client_max_body_size 1m;
      proxy_pass http://127.0.0.1:8081;
    }

    location ~ ^/api/admin/gods-eye-view/oci-voice/test$ {
      client_max_body_size 3m;
      proxy_pass http://127.0.0.1:8000;
      proxy_read_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/oci/callback {
      access_log off;
      error_log /dev/null;
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
      client_max_body_size 1m;
      proxy_pass http://127.0.0.1:8000;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
