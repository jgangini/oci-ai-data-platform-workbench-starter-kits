user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location = /_prisma_session {
      internal;
      proxy_pass http://127.0.0.1:8000/api/admin/session;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Forwarded-Proto http;
    }

    location = /prisma { return 308 /prisma/; }
    location /prisma/ {
      auth_request /_prisma_session;
      auth_request_set $prisma_user $upstream_http_x_prisma_user;
      proxy_set_header X-PRISMA-User $prisma_user;
      proxy_set_header Host $host;
      proxy_pass http://127.0.0.1:8081/;
    }

    location /api/prisma/ {
      auth_request /_prisma_session;
      auth_request_set $prisma_user $upstream_http_x_prisma_user;
      proxy_set_header X-PRISMA-User $prisma_user;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
      client_max_body_size 1m;
      proxy_pass http://127.0.0.1:8081;
    }

    location /api/ {
      client_max_body_size 1m;
      proxy_pass http://127.0.0.1:8000;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
